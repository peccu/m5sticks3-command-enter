name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ hashFiles('**/claude-keyboard.ino') }}
          restore-keys: arduino-

      - name: Install ESP32 platform
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli config add board_manager.additional_urls \
            https://m5stack.oss-cn-shenzhen.aliyuncs.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core install m5stack:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "M5Unified"
          arduino-cli lib install "ESP32 BLE Keyboard"

      # FQBN: m5stack:esp32:m5stack_sticks3 (確認済み)
      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn m5stack:esp32:m5stack_sticks3 \
            --export-binaries \
            claude-keyboard

      # M5Burner / esptool で直接焼ける merged binary を生成
      # ESP32-S3 はブートローダーが 0x0000
      - name: Create merged binary
        run: |
          pip install esptool
          BUILD=claude-keyboard/build/m5stack.esp32.m5stack_sticks3
          BOOT_APP0=$(find ~/.arduino15 -name "boot_app0.bin" | head -1)
          python -m esptool --chip esp32s3 merge_bin \
            -o merged-firmware.bin \
            --flash_mode dio --flash_size 8MB \
            0x0000 ${BUILD}/claude-keyboard.ino.bootloader.bin \
            0x8000 ${BUILD}/claude-keyboard.ino.partitions.bin \
            0xe000 ${BOOT_APP0} \
            0x10000 ${BUILD}/claude-keyboard.ino.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            claude-keyboard/build/m5stack.esp32.m5stack_sticks3/claude-keyboard.ino.bin
            merged-firmware.bin

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            claude-keyboard/build/m5stack.esp32.m5stack_sticks3/claude-keyboard.ino.bin
            merged-firmware.bin
