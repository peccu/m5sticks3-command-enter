; =============================================================
; M5StickS3 BT Keyboard — PlatformIO project config
; =============================================================
; Board candidates:
;   m5stick-c-plus2  … M5StickC Plus2 (ESP32-PICO-V3-02)
;   m5stack-stamps3  … M5StampS3       (ESP32-S3)
;
; Run `pio boards m5stack` to list all recognized boards.
; Adjust `board` and `build_flags` below to match your hardware.
; =============================================================

[platformio]
default_envs = m5sticks3

[env:m5sticks3]
platform  = espressif32
board     = m5stick-c-plus2
framework = arduino

; 8 MB flash partition table
board_build.partitions = default_8MB.csv

upload_speed  = 921600
monitor_speed = 115200

lib_deps =
    m5stack/M5Unified @ ^0.2.2

build_flags =
    -DCORE_DEBUG_LEVEL=0
