name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      # ボード定義とライブラリを毎回インストールするのは遅いのでキャッシュする
      - name: Cache Arduino packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ hashFiles('**/claude-keyboard.ino') }}
          restore-keys: arduino-

      - name: Install ESP32 platform
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: arduino-cli lib install "M5Unified"

      # FQBN の確認: arduino-cli board listall m5stack
      # M5StickC Plus2 は esp32:esp32:m5stick-c-plus2
      # 実機に合わせて変更してください
      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:m5stick-c-plus2 \
            --export-binaries \
            claude-keyboard

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: claude-keyboard/build/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: claude-keyboard/build/**/*.bin
